[package]
name = "roncho"
version = "0.1.1"
edition = "2021"
rust-version = "1.95"
description = "Rust SDK for Honcho — persistent, reasoning-based memory for agents"
repository = "https://github.com/kisom/roncho"
license = "Apache-2.0"
keywords = ["honcho", "memory", "agent", "rag", "sdk"]
categories = ["api-bindings", "asynchronous"]

[workspace]
members = ["cli"]
resolver = "2"

[lib]
name = "roncho"
path = "src/lib.rs"

[features]
default = ["async", "blocking"]
# Tokio client. Not part of a `default-features = false, features = ["blocking"]` build.
async = ["dep:reqwest", "dep:url", "dep:async-stream", "dep:futures", "dep:tokio", "dep:bytes"]
# std::net HTTP/1.1 client. No async runtime and no default base URL.
blocking = []
# HTTPS for the blocking client. rustls 0.23 with the ring provider and the
# platform trust store. Not part of a plain `blocking` build.
tls = ["blocking", "dep:rustls", "dep:rustls-native-certs"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zeroize = { version = "1.9.0", default-features = false, features = ["alloc"] }
toml = "1.1"
reqwest = { version = "0.12", optional = true, default-features = false, features = ["json", "rustls-tls", "stream"] }
url = { version = "2", optional = true }
async-stream = { version = "0.3", optional = true }
futures = { version = "0.3", optional = true }
tokio = { version = "1", optional = true, features = ["time", "sync", "io-util"] }
bytes = { version = "1", optional = true }
rustls = { version = "0.23.45", optional = true, default-features = false, features = ["std", "tls12", "ring"] }
rustls-native-certs = { version = "0.8.4", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
mockito = "1.7"
serde_json = "1"
rcgen = "0.13"

[[example]]
name = "quickstart"
path = "examples/quickstart.rs"
required-features = ["async"]
