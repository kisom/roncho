[package]
name = "roncho"
version = "0.1.0"
edition = "2021"
description = "Rust SDK for Honcho — persistent, reasoning-based memory for agents"
license = "Apache-2.0"
repository = "https://git.wntrmute.dev/kyle/roncho"
keywords = ["honcho", "memory", "agent", "rag", "sdk"]
categories = ["api-bindings", "asynchronous"]

[lib]
name = "roncho"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
async-stream = "0.3"
futures = "0.3"
tokio = { version = "1", features = ["time", "sync", "io-util"] }
bytes = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
mockito = "1.7"
serde_json = "1"

[features]
default = []

[[example]]
name = "quickstart"
path = "examples/quickstart.rs"
