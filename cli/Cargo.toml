[package]
name = "roncho-cli"
version = "0.1.0"
edition = "2021"
description = "Command-line interface for the Honcho memory platform"
license = "Apache-2.0"
repository = "https://git.wntrmute.dev/kyle/roncho"

[[bin]]
name = "roncho"
path = "src/main.rs"

[dependencies]
roncho = { path = ".." }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
futures = "0.3"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
